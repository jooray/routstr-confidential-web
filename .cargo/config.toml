# getrandom 0.3/0.4 need the wasm_js backend selected explicitly on
# wasm32-unknown-unknown (getrandom 0.2 uses its `js` feature instead).
# simd128 (Chrome 91+, Firefox 89+, Safari 16.4+): ~20% faster 2PC
# preprocessing and ~30% faster proofs than scalar wasm on this code.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"', '-C', 'target-feature=+simd128']
