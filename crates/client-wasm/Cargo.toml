[package]
name = "client-wasm"
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false
description = "Browser (wasm32) build of the client side of the routstr confidential-mode protocol v2: the 2PC handshake (cu-2pc) and the proof channel (cu-prover --channel)"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
sha2 = "0.10"

[dependencies]
twopc = { path = "../vendor/twopc" }
zkbench = { path = "../vendor/zkbench" }
futures = "0.3"
tokio = { version = "1.38", features = ["sync", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# Every getrandom major version in the tree needs its browser backend.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.38", features = ["full"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "std"] }
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
